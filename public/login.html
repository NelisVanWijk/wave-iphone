<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#151719">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Inloggen · WAVE</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/login.js"></script>
</head>
<body><main class="player-shell login-shell">
  <a class="wordmark" href="/">WAVE<span class="brand-dot">/</span></a>
  <h1>Jouw radio, overal.</h1>
  <p class="sheet-note">Log in om te luisteren. Op dit apparaat blijf je maximaal 90 dagen ingelogd.</p>
  <form id="login-form" method="post" action="/auth/login">
    <label for="password">Wachtwoord</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="1024">
    <button class="secondary-button" id="login-submit" type="submit" disabled>Inloggen</button>
    <p id="login-error" role="alert"></p>
  </form>
</main></body></html>
